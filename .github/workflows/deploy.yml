on:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  production:
    runs-on: ubuntu-latest
    environment: { name: production, url: "${{ steps.deploy.outputs.url }}" }
    concurrency: { group: production, queue: max }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 11.28.5 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: deploy
        uses: samebase/convex-hosting/actions/deploy@ceb6259a5fa3292bdbf05675a48327ec7b9cffa6 # v1.2.1
        with: { deploy-key: "${{ secrets.CONVEX_DEPLOY_KEY }}" }
